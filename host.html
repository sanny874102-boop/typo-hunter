<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>抓錯字大作戰 - 大螢幕主控台</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #f8fafc; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 16px; margin-bottom: 24px; }
    .q-control { display: flex; align-items: center; gap: 10px; background: #1e293b; padding: 6px 14px; border-radius: 8px; margin-top: 6px; }
    .container { display: grid; grid-template-columns: 2fr 1.2fr; gap: 24px; }
    .panel { background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .passage { font-size: 1.8rem; line-height: 2.2; letter-spacing: 3px; background: #0b1120; padding: 24px; border-radius: 8px; border: 1px solid #334155; min-height: 180px; }
    .highlight-typo { background-color: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .correction-badge { background-color: #22c55e; color: white; font-size: 1.05rem; vertical-align: super; padding: 2px 6px; border-radius: 4px; margin-left: 2px; }
    .btn { padding: 9px 16px; font-size: 0.95rem; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-green { background: #22c55e; color: white; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-orange { background: #f97316; color: white; }
    .btn-red { background: #ef4444; color: white; }
    .btn-purple { background: #8b5cf6; color: white; }
    .btn-gray { background: #475569; color: white; }
    .btn:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.95rem; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; }
    #qrcode { display: flex; justify-content: center; margin: 12px 0; background: white; padding: 12px; border-radius: 8px; width: fit-content; }
    
    .admin-locked { display: none !important; }
    .badge-status { font-size: 0.85rem; padding: 4px 8px; border-radius: 4px; vertical-align: middle; margin-left: 8px; }
    .badge-locked { background: #64748b; color: #f8fafc; }
    .badge-unlocked { background: #10b981; color: #ffffff; }

    .players-box { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; max-height: 100px; overflow-y: auto; padding: 10px; background: #0b1120; border-radius: 8px; border: 1px solid #334155; }
    .player-tag { background: #334155; color: #38bdf8; padding: 3px 8px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
    
    /* 榜單切換分頁標籤 */
    .tab-bar { display: flex; gap: 8px; margin-top: 16px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .tab-btn { background: none; border: none; color: #94a3b8; font-size: 1rem; font-weight: bold; cursor: pointer; padding: 4px 10px; border-radius: 6px; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1 style="margin: 0; display: inline-block;">🎮 抓錯字大挑戰 - 大螢幕主控台</h1>
    <span id="admin-badge" class="badge-status badge-locked">看板模式</span>
    
    <div class="q-control">
      <button id="start-game-btn" class="btn btn-purple admin-ctrl admin-locked" onclick="startFirstQuestion()">🚀 開始第 1 題</button>
      <button class="btn btn-gray admin-ctrl admin-locked" onclick="changeQuestion(-1)">◀ 上一題</button>
      <span id="current-q-text" style="font-weight: bold; font-size: 1.1rem; color: #38bdf8;">準備中</span>
      <button class="btn btn-blue admin-ctrl admin-locked" onclick="changeQuestion(1)">下一題 ▶</button>
    </div>
  </div>

  <div>
    <button id="auth-btn" class="btn btn-blue" onclick="toggleAdminMode()">🔑 管理員登入</button>
    <button class="btn btn-orange admin-ctrl admin-locked" onclick="revealAnswers()">📢 公布本題答案</button>
    <button class="btn btn-green admin-ctrl admin-locked" onclick="exportToExcel()">📊 下載總成績 Excel</button>
    <button class="btn btn-red admin-ctrl admin-locked" onclick="resetRound()">⚠️ 清空總紀錄</button>
  </div>
</div>

<div class="container">
  <div class="panel">
    <h2>📄 文章內容</h2>
    <div id="passage-box" class="passage">🎮 遊戲準備中，等待老師開始...</div>
  </div>

  <div class="panel">
    <h2>📱 掃描加入遊戲</h2>
    <div id="qrcode"></div>
    <p id="student-url" style="color: #94a3b8; font-size: 0.85rem; word-break: break-all;"></p>

    <h3>👥 已連線玩家 (<span id="player-count" style="color: #38bdf8;">0</span> 人)</h3>
    <div class="players-box" id="players-list">
      <span style="color: #64748b; font-size: 0.9rem;">等待學生掃碼加入...</span>
    </div>

    <!-- 榜單標籤切換 -->
    <div class="tab-bar">
      <button id="tab-curr" class="tab-btn active" onclick="switchTab('current')">🎯 本題作答詳情</button>
      <button id="tab-total" class="tab-btn" onclick="switchTab('total')">🏆 全場累積排行榜</button>
    </div>

    <!-- 本題作答詳情表格 -->
    <table id="table-curr">
      <thead>
        <tr><th>姓名</th><th>抓對</th><th>誤抓</th><th>漏抓</th><th>本題得分</th></tr>
      </thead>
      <tbody id="current-q-body">
        <tr><td colspan="5" style="text-align:center; color: #64748b;">等待作答...</td></tr>
      </tbody>
    </table>

    <!-- 全場總榜表格 -->
    <table id="table-total" style="display: none;">
      <thead>
        <tr><th>排名</th><th>姓名</th><th>抓對/誤抓/漏抓</th><th>累計總分</th></tr>
      </thead>
      <tbody id="total-body">
        <tr><td colspan="4" style="text-align:center; color: #64748b;">等待學生作答中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzkepQmz0ZMwzltM4zLdOM6VvpFXzIaz0W_p-Nrv6dIPSyo1XQ3mGCQbWFhIu3BqqWZ/exec"; // 請確認已替換為正確的 GAS URL
  const ADMIN_PASS = "4321";
  let isAdmin = false;
  let hostData = null;
  let currentTab = "current";

  function toggleAdminMode() {
    if (isAdmin) {
      isAdmin = false;
      applyAdminUI();
      return;
    }

    const input = prompt("請輸入密碼：");
    if (input === ADMIN_PASS) {
      isAdmin = true;
      applyAdminUI();
    } else if (input !== null) {
      alert("密碼錯誤！");
    }
  }

  function applyAdminUI() {
    const controls = document.querySelectorAll(".admin-ctrl");
    const authBtn = document.getElementById("auth-btn");
    const badge = document.getElementById("admin-badge");

    if (isAdmin) {
      controls.forEach(el => el.classList.remove("admin-locked"));
      authBtn.innerText = "🔒 退出管理員";
      authBtn.className = "btn btn-gray";
      badge.innerText = "管理員模式";
      badge.className = "badge-status badge-unlocked";
      if (hostData && hostData.currentQ === 0) {
        document.getElementById("start-game-btn").style.display = "inline-block";
      }
    } else {
      controls.forEach(el => el.classList.add("admin-locked"));
      authBtn.innerText = "🔑 管理員登入";
      authBtn.className = "btn btn-blue";
      badge.innerText = "看板模式";
      badge.className = "badge-status badge-locked";
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    if (tab === "current") {
      document.getElementById("tab-curr").className = "tab-btn active";
      document.getElementById("tab-total").className = "tab-btn";
      document.getElementById("table-curr").style.display = "table";
      document.getElementById("table-total").style.display = "none";
    } else {
      document.getElementById("tab-curr").className = "tab-btn";
      document.getElementById("tab-total").className = "tab-btn active";
      document.getElementById("table-curr").style.display = "none";
      document.getElementById("table-total").style.display = "table";
    }
  }

  window.onload = function() {
    const playerUrl = window.location.href.replace(/host\.html.*$/, 'index.html');
    document.getElementById("student-url").innerText = playerUrl;
    new QRCode(document.getElementById("qrcode"), {
      text: playerUrl,
      width: 130,
      height: 130
    });

    loadData();
    setInterval(loadData, 3000);
  };

  async function loadData() {
    try {
      const res = await fetch(`${GAS_URL}?action=getHostData&t=${Date.now()}`);
      const data = await res.json();
      hostData = data;

      renderPlayers(data.players || []);

      if (data.currentQ === 0) {
        document.getElementById("current-q-text").innerText = "準備中";
        document.getElementById("passage-box").innerText = "🎮 遊戲準備中，等待老師開始第 1 題！";
        document.getElementById("start-game-btn").style.display = isAdmin ? "inline-block" : "none";
      } else {
        document.getElementById("current-q-text").innerText = `第 ${data.currentQ} / ${data.totalQuestions} 題`;
        document.getElementById("start-game-btn").style.display = "none";

        if (data.isRevealed) {
          renderRevealedPassage(data);
        } else {
          document.getElementById("passage-box").innerText = data.text;
        }
      }

      renderCurrentQBoard(data.currentQStats || {});
      renderTotalBoard(data.totalStats || {});
    } catch (e) {
      console.error("更新失敗", e);
    }
  }

  function renderPlayers(players) {
    document.getElementById("player-count").innerText = players.length;
    const box = document.getElementById("players-list");
    if (players.length === 0) {
      box.innerHTML = `<span style="color: #64748b; font-size: 0.9rem;">等待學生掃碼加入...</span>`;
      return;
    }
    box.innerHTML = players.map(name => `<span class="player-tag">👤 ${name}</span>`).join("");
  }

  // 渲染當前題作答詳情
  function renderCurrentQBoard(currStats) {
    const tbody = document.getElementById("current-q-body");
    const list = Object.entries(currStats).map(([name, s]) => ({ name, ...s }))
      .sort((a, b) => b.score - a.score);

    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: #64748b;">本題尚無作答數據</td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(item => `
      <tr>
        <td><b>${item.name}</b></td>
        <td style="color:#22c55e;">+${item.correctCount}</td>
        <td style="color:#ef4444;">-${item.wrongCount}</td>
        <td style="color:#f97316;">${item.missedCount > 0 ? `-${item.missedCount}` : '0'}</td>
        <td style="color:#38bdf8; font-weight:bold;">${item.score}</td>
      </tr>
    `).join("");
  }

  // 渲染全場累積榜
  function renderTotalBoard(totalStats) {
    const tbody = document.getElementById("total-body");
    const list = Object.entries(totalStats).map(([name, s]) => ({ name, ...s }))
      .sort((a, b) => b.score - a.score);

    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: #64748b;">等待作答中...</td></tr>`;
      return;
    }

    tbody.innerHTML = list.map((item, idx) => `
      <tr>
        <td>${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1}</td>
        <td><b>${item.name}</b></td>
        <td>
          <span style="color:#22c55e;">${item.correctCount}</span> / 
          <span style="color:#ef4444;">${item.wrongCount}</span> / 
          <span style="color:#f97316;">${item.missedCount}</span>
        </td>
        <td style="color:#38bdf8; font-weight:bold;">${item.score}</td>
      </tr>
    `).join("");
  }

  async function startFirstQuestion() {
    await fetch(`${GAS_URL}?action=switchQuestion&qIndex=1&t=${Date.now()}`);
    loadData();
  }

  async function changeQuestion(offset) {
    if (!hostData || hostData.currentQ === 0) return alert("請先點擊【🚀 開始第 1 題】！");
    const nextQ = hostData.currentQ + offset;
    if (nextQ < 1 || nextQ > hostData.totalQuestions) {
      return alert("已經沒有更多題目了！");
    }

    await fetch(`${GAS_URL}?action=switchQuestion&qIndex=${nextQ}&t=${Date.now()}`);
    loadData();
  }

  async function revealAnswers() {
    if (!hostData || hostData.currentQ === 0) return alert("挑戰尚未開始！");
    await fetch(`${GAS_URL}?action=setReveal&t=${Date.now()}`);
    loadData();
  }

  function renderRevealedPassage(data) {
    let html = data.text;
    data.typos.forEach((typo, i) => {
      const correct = data.corrections[i] || "";
      const regex = new RegExp(typo, "g");
      html = html.replace(regex, `<span class="highlight-typo">${typo}</span><span class="correction-badge">應為: ${correct}</span>`);
    });
    document.getElementById("passage-box").innerHTML = html;
  }

  function exportToExcel() {
    if (!hostData || Object.keys(hostData.totalStats).length === 0) {
      return alert("目前沒有作答紀錄可匯出！");
    }

    const exportData = Object.entries(hostData.totalStats).map(([name, stat], idx) => ({
      "排名": idx + 1,
      "姓名/座號": name,
      "累計抓對字數": stat.correctCount,
      "累計誤抓字數": stat.wrongCount,
      "累計漏抓錯字": stat.missedCount,
      "總積分": stat.score
    })).sort((a, b) => b["總積分"] - a["總積分"]);

    const worksheet = XLSX.utils.json_to_sheet(exportData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "挑戰總成績");
    XLSX.writeFile(workbook, `抓錯字挑戰累計成績單_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  async function resetRound() {
    if (!confirm("確定要清空所有紀錄並回到未開始狀態嗎？")) return;
    await fetch(`${GAS_URL}?action=resetScores&t=${Date.now()}`);
    loadData();
    alert("已重設遊戲為準備階段！");
  }
</script>
</body>
</html>
