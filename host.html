<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>抓錯字大作戰 - 大螢幕主控台</title>
  <!-- 引入 QR Code 產生庫 與 SheetJS (Excel匯出庫) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #f8fafc; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 16px; margin-bottom: 24px; }
    .container { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    .panel { background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    .passage { font-size: 1.8rem; line-height: 2.2; letter-spacing: 3px; background: #0f172a; padding: 24px; border-radius: 8px; border: 1px solid #334155; }
    .highlight-typo { background-color: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .correction-badge { background-color: #22c55e; color: white; font-size: 1rem; vertical-align: super; padding: 2px 6px; border-radius: 4px; margin-left: 2px; }
    .btn { padding: 10px 18px; font-size: 1rem; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-right: 8px; transition: 0.2s; }
    .btn-green { background: #22c55e; color: white; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-orange { background: #f97316; color: white; }
    .btn-red { background: #ef4444; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; }
    #qrcode { display: flex; justify-content: center; margin: 16px 0; background: white; padding: 16px; border-radius: 8px; width: fit-content; }
  </style>
</head>
<body>

<div class="header">
  <h1>🎮 抓錯字大挑戰 - 投影主控台</h1>
  <div>
    <button class="btn btn-blue" onclick="loadData()">🔄 刷新榜單</button>
    <button class="btn btn-orange" onclick="revealAnswers()">📢 公布答案與結算</button>
    <button class="btn btn-green" onclick="exportToExcel()">📊 下載 Excel 成績</button>
    <button class="btn btn-red" onclick="resetRound()">⚠️ 清空紀錄</button>
  </div>
</div>

<div class="container">
  <div class="panel">
    <h2>📄 文章內容</h2>
    <div id="passage-box" class="passage">載入中...</div>
  </div>

  <div class="panel">
    <h2>📱 掃描加入遊戲</h2>
    <div id="qrcode"></div>
    <p id="student-url" style="color: #94a3b8; font-size: 0.85rem; word-break: break-all;"></p>

    <h3>🏆 即時英雄榜</h3>
    <table>
      <thead>
        <tr><th>排名</th><th>姓名</th><th>答對/錯</th><th>總分</th></tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="4" style="text-align:center; color: #64748b;">暫無作答紀錄</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 請在此填入您的 GAS Web App URL
  const GAS_URL = "https://script.google.com/macros/library/d/1H1uOKvqiFagcgxJsALGeSDKOAEjQepW5y0sNge_d7XDWmRcN156nM2fn/1";
  let cachedResults = null;

  window.onload = function() {
    // 自動生成指向學生端的 QR Code (預設同個路徑下的 index.html)
    const playerUrl = window.location.href.replace(/host\.html.*$/, 'index.html');
    document.getElementById("student-url").innerText = playerUrl;
    new QRCode(document.getElementById("qrcode"), {
      text: playerUrl,
      width: 160,
      height: 160
    });

    loadData();
    // 每 5 秒自動輪詢一次成績排行榜
    setInterval(loadData, 5000);
  };

  async function loadData() {
    try {
      const res = await fetch(`${GAS_URL}?action=getResults`);
      const data = await res.json();
      cachedResults = data;

      // 如果尚未公布解答，維持原始文章
      if (!window.isRevealed) {
        document.getElementById("passage-box").innerText = data.text;
      }

      renderLeaderboard(data.stats);
    } catch (e) {
      console.error("載入失敗", e);
    }
  }

  function renderLeaderboard(stats) {
    const tbody = document.getElementById("leaderboard-body");
    const sorted = Object.entries(stats).map(([name, val]) => ({ name, ...val }))
      .sort((a, b) => b.score - a.score);

    if (sorted.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: #64748b;">等待學生作答中...</td></tr>`;
      return;
    }

    tbody.innerHTML = sorted.map((player, idx) => `
      <tr>
        <td>${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1}</td>
        <td><b>${player.name}</b></td>
        <td><span style="color:#4ade80;">${player.correctCount}</span> / <span style="color:#f87171;">${player.wrongCount}</span></td>
        <td style="color:#38bdf8; font-weight:bold;">${player.score}</td>
      </tr>
    `).join("");
  }

  function revealAnswers() {
    if (!cachedResults) return;
    window.isRevealed = true;
    let html = cachedResults.text;

    // 將所有錯字高亮，並標上正確字
    cachedResults.typos.forEach((typo, i) => {
      const correct = cachedResults.corrections[i] || "";
      const regex = new RegExp(typo, "g");
      html = html.replace(regex, `<span class="highlight-typo">${typo}</span><span class="correction-badge">改為: ${correct}</span>`);
    });

    document.getElementById("passage-box").innerHTML = html;
  }

  function exportToExcel() {
    if (!cachedResults || Object.keys(cachedResults.stats).length === 0) {
      return alert("目前沒有作答成績可匯出！");
    }

    const exportData = Object.entries(cachedResults.stats).map(([name, stat], idx) => ({
      "排名": idx + 1,
      "姓名/座號": name,
      "答對次數": stat.correctCount,
      "答錯次數": stat.wrongCount,
      "總積分": stat.score
    })).sort((a, b) => b["總積分"] - a["總積分"]);

    const worksheet = XLSX.utils.json_to_sheet(exportData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "成績總表");
    XLSX.writeFile(workbook, `抓錯字遊戲成績單_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  async function resetRound() {
    if (!confirm("確定要清空本回合所有成績嗎？這會清除資料庫中的作答數據。")) return;
    await fetch(`${GAS_URL}?action=resetScores`);
    window.isRevealed = false;
    loadData();
    alert("成績已清空，可開始新一輪！");
  }
</script>
</body>
</html>
