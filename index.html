<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>掠漏大車拚 - 學生端</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; 
      padding: 16px 12px; 
      background-color: #0f172a; 
      color: #1e293b; 
    }
    .card { 
      background: white; 
      padding: 20px 16px; 
      border-radius: 14px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
      max-width: 600px; 
      margin: 0 auto; 
    }
    h2 { margin-top: 0; text-align: center; color: #0f172a; font-size: 1.6rem; }
    input[type="text"] { 
      width: 100%; 
      padding: 12px; 
      font-size: 16px; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      margin-bottom: 12px; 
    }
    button { 
      width: 100%; 
      padding: 12px; 
      font-size: 16px; 
      border: none; 
      border-radius: 8px; 
      background-color: #2563eb; 
      color: white; 
      font-weight: bold; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    button:active { background-color: #1d4ed8; }
    .status-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 14px; 
      padding: 10px 14px; 
      background: #e2e8f0; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 1.05rem;
    }
    .q-badge { 
      background: #3b82f6; 
      color: white; 
      padding: 3px 8px; 
      border-radius: 6px; 
      font-size: 0.85rem; 
      margin-left: 6px; 
    }
    
    /* 文章容器：使用彈性分行佈局，保證每行獨立 */
    .passage { 
      border: 1px solid #e2e8f0; 
      padding: 18px 14px; 
      border-radius: 10px; 
      background: #f8fafc; 
      min-height: 180px; 
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .passage-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      min-height: 38px;
      line-height: 1.8;
      font-size: 1.55rem;
      letter-spacing: 2px;
    }

    .char { 
      cursor: pointer; 
      padding: 2px 4px; 
      border-radius: 6px; 
      transition: 0.15s; 
      display: inline-block; 
      user-select: none;
      margin: 1px;
    }
    .char:hover { background-color: #cbd5e1; }
    .char.selected { background-color: #fed7aa; }
    .char.submitted { background-color: #64748b !important; color: white !important; cursor: default; }
    .char.correct { background-color: #22c55e !important; color: white !important; cursor: default; font-weight: bold; }
    .char.wrong { background-color: #ef4444 !important; color: white !important; cursor: default; font-weight: bold; }
    
    .selection-box { 
      margin-top: 16px; 
      padding: 14px; 
      border: 2px dashed #cbd5e1; 
      border-radius: 10px; 
      text-align: center; 
    }
    .submit-btn { margin-top: 10px; background-color: #059669; font-size: 1.1rem; }
    .submit-btn.disabled { opacity: 0.45; pointer-events: none; }
    #msg-toast { min-height: 24px; font-weight: bold; margin-top: 6px; font-size: 0.95rem; }
    .missed-tag { display: inline-block; background: #fef2f2; border: 1px solid #f87171; color: #dc2626; padding: 2px 8px; border-radius: 6px; margin: 4px 2px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card" id="login-view">
  <h2>🔍 掠漏大車拚</h2>
  <p style="color: #64748b; text-align: center; font-size: 0.95rem;">抓出錯字加分，誤抓扣分；漏抓錯字結算時也會扣分！</p>
  <input type="text" id="student-name" placeholder="請輸入姓名或座號（例：05 王小明）">
  <button id="join-btn" onclick="joinGame()">進入挑戰</button>
</div>

<div class="card" id="game-view" style="display: none;">
  <div class="status-bar" id="status-bar">
    <div>
      <span id="display-name"></span>
      <span class="q-badge" id="q-label">準備中</span>
    </div>
    <span>總分：<span id="my-score" style="color: #2563eb;">-- 分</span></span>
  </div>

  <div class="passage" id="text-container">等待挑戰開始...</div>

  <div class="selection-box" id="selection-box">
    <div>目前劃記：<b id="current-word" style="color: #2563eb; font-size: 1.25rem;">尚未選擇</b></div>
    <div id="msg-toast"></div>
    <button class="submit-btn disabled" id="submit-btn" onclick="submitSelection()">確認送出</button>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxj6kgSqTEKOuQ-F7yoTksRhzao0K2Qr-uUKaINWWQfdUgbHlDjBe3jy-_wWMAWG5wZ/exec";

  let studentName = "";
  let currentQIndex = -1;
  let articleText = "";
  let selectedIndices = [];
  let submittedIndicesMap = [];
  let pollingTimer = null;
  let isCurrentQRevealed = false;

  async function joinGame() {
    studentName = document.getElementById("student-name").value.trim();
    if (!studentName) return alert("請輸入姓名或座號！");

    const joinBtn = document.getElementById("join-btn");
    joinBtn.innerText = "連線登入中...";
    joinBtn.disabled = true;

    try {
      await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", name: studentName })
      });
    } catch (e) {
      console.error("登入註冊失敗", e);
    }

    document.getElementById("login-view").style.display = "none";
    document.getElementById("game-view").style.display = "block";
    document.getElementById("display-name").innerText = studentName;

    syncQuestion();
    pollingTimer = setInterval(syncQuestion, 3000);
  }

  async function syncQuestion() {
    try {
      const res = await fetch(`${GAS_URL}?action=getCurrentQuestion&t=${Date.now()}`);
      const data = await res.json();

      if (data.qIndex !== currentQIndex) {
        currentQIndex = data.qIndex;
        articleText = data.text;
        isCurrentQRevealed = false;
        submittedIndicesMap = [];
        selectedIndices = [];

        if (currentQIndex === 0) {
          document.getElementById("q-label").innerText = "準備中";
          document.getElementById("my-score").innerText = "-- 分";
          document.getElementById("text-container").innerText = "🎮 挑戰尚未開始，請稍候老師發送題目！";
          document.getElementById("selection-box").innerHTML = `
            <div style="color: #64748b; font-weight: bold; font-size: 1rem;">連線成功，等待老師開始第 1 題...</div>
          `;
          return;
        }

        document.getElementById("q-label").innerText = `第 ${currentQIndex} / ${data.totalQuestions} 題`;
        document.getElementById("my-score").innerText = "作答中...";
        resetSelectionBoxUI();
        renderText(articleText);
      }

      if (currentQIndex > 0 && !isCurrentQRevealed) {
        const statusRes = await fetch(`${GAS_URL}?action=checkStudentStatus&name=${encodeURIComponent(studentName)}&qIndex=${currentQIndex}&t=${Date.now()}`);
        const statusData = await statusRes.json();

        if (statusData.isRevealed) {
          isCurrentQRevealed = true;
          revealResults(statusData);
        }
      }
    } catch (err) {
      console.error("同步失敗", err);
    }
  }

  // 逐行封裝渲染：保證換行、空行與每一行段落完全對齊大螢幕
  function renderText(text) {
    const container = document.getElementById("text-container");
    container.innerHTML = "";
    
    const lines = text.split("\n");
    let globalIndex = 0;

    lines.forEach(line => {
      const lineDiv = document.createElement("div");
      lineDiv.className = "passage-line";

      if (line.trim().length === 0) {
        // 空行，保留上下間距
        lineDiv.style.minHeight = "24px";
      } else {
        line.split("").forEach(char => {
          const currentIndex = globalIndex;
          if (char === " " || char === " ") {
            const spaceSpan = document.createElement("span");
            spaceSpan.innerHTML = "&nbsp;";
            spaceSpan.style.display = "inline-block";
            spaceSpan.style.width = "8px";
            lineDiv.appendChild(spaceSpan);
          } else {
            const span = document.createElement("span");
            span.className = "char";
            span.innerText = char;
            span.dataset.index = currentIndex;
            span.onclick = () => toggleSelect(currentIndex, span);
            lineDiv.appendChild(span);
          }
          globalIndex++;
        });
      }
      globalIndex++; // 計入換行符號位移
      container.appendChild(lineDiv);
    });
  }

  function toggleSelect(idx, span) {
    if (currentQIndex === 0 || isCurrentQRevealed || span.classList.contains("submitted") || span.classList.contains("correct") || span.classList.contains("wrong")) return;

    if (selectedIndices.includes(idx)) {
      selectedIndices = selectedIndices.filter(i => i !== idx);
      span.classList.remove("selected");
    } else {
      selectedIndices.push(idx);
      selectedIndices.sort((a, b) => a - b);
      span.classList.add("selected");
    }

    const selectedWord = selectedIndices.map(i => articleText[i]).filter(Boolean).join("");
    document.getElementById("current-word").innerText = selectedWord || "尚未選擇";

    const submitBtn = document.getElementById("submit-btn");
    if (selectedWord.length > 0) submitBtn.classList.remove("disabled");
    else submitBtn.classList.add("disabled");
  }

  async function submitSelection() {
    if (selectedIndices.length === 0) return;

    const submitBtn = document.getElementById("submit-btn");
    const toast = document.getElementById("msg-toast");

    submitBtn.classList.add("disabled");
    submitBtn.innerText = "傳送中...";
    toast.innerText = "";

    const charPayload = selectedIndices.map(idx => ({
      index: idx,
      char: articleText[idx]
    }));

    try {
      const response = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ name: studentName, chars: charPayload })
      });
      const res = await response.json();

      if (!res.success) {
        toast.style.color = "#dc2626";
        toast.innerText = res.error || "傳送失敗";
        return;
      }

      charPayload.forEach(item => {
        submittedIndicesMap.push(item);
        const el = document.querySelector(`.char[data-index='${item.index}']`);
        if (el) {
          el.className = "char submitted";
          el.onclick = null;
        }
      });

      toast.style.color = "#0284c7";
      toast.innerText = `✓ 已送出 ${charPayload.length} 個字！`;
    } catch (e) {
      toast.style.color = "#dc2626";
      toast.innerText = "連線失敗，請再試一次！";
    } finally {
      selectedIndices = [];
      document.getElementById("current-word").innerText = "尚未選擇";
      submitBtn.innerText = "確認送出";
    }
  }

  function revealResults(statusData) {
    document.getElementById("my-score").innerText = `${statusData.totalScore} 分`;

    let missedHtml = "";
    if (statusData.missedTypos && statusData.missedTypos.length > 0) {
      missedHtml = `
        <div style="margin-top: 10px; font-size: 0.95rem; color: #dc2626;">
          ⚠️ 漏抓錯字：${statusData.missedTypos.map(c => `<span class="missed-tag">${c}</span>`).join(" ")} (扣分)
        </div>
      `;
    }

    document.getElementById("selection-box").innerHTML = `
      <div style="font-size: 1.15rem; font-weight: bold; color: #1e293b;">📢 本題已公布答案！</div>
      <p style="color: #64748b; margin: 4px 0 0; font-size: 0.95rem;">綠色為抓對錯字，紅色為誤抓正常字。</p>
      ${missedHtml}
    `;

    submittedIndicesMap.forEach(item => {
      const matched = statusData.answers.find(a => a.char === item.char);
      const el = document.querySelector(`.char[data-index='${item.index}']`);
      if (el && matched) {
        el.className = `char ${matched.isCorrect ? 'correct' : 'wrong'}`;
      }
    });
  }

  function resetSelectionBoxUI() {
    const box = document.getElementById("selection-box");
    box.innerHTML = `
      <div>目前劃記：<b id="current-word" style="color: #2563eb; font-size: 1.25rem;">尚未選擇</b></div>
      <div id="msg-toast"></div>
      <button class="submit-btn disabled" id="submit-btn">確認送出</button>
    `;
    document.getElementById("submit-btn").onclick = submitSelection;
  }
</script>
</body>
</html>
